  bio: >-
    我在东北大学自然语言处理实验室做博士研究，关心大模型如何<strong>长久地记住</strong>、
    如何<strong>更省地推理</strong>，以及如何在复杂任务上学会规划。大部分时间花在研究大模型记忆、
    上下文压缩与推理加速、以及推理后训练这三件事上；最近对<strong>持续学习</strong>和 <strong>LLM agent</strong> 很感兴趣并保持关注。
