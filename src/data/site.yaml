    repo: helldog-star/MemoSight
    lang: Python
    stars: 3
    body: 统一上下文压缩与多 token 预测的推理加速框架，官方 PyTorch 实现。
  - name: TGPO
    repo: helldog-star/TGPO
    lang: Python
    stars: 2
    body: 教师引导策略优化，面向大策略分歧下的 on-policy 推理蒸馏。
  - name: RRcot
    repo: helldog-star/RRcot
    lang: Python
    stars: 5
    body: 长 CoT 推理的上下文压缩实验框架（LightThinker / AnLLM），含 EPL 位置布局与 MTP 配置。
  - name: IIET
    repo: helldog-star/IIET
    lang: Python
    stars: 1
    body: 迭代隐式欧拉 Transformer 的官方实现（EMNLP 2025）。

